[general]
import = [
    "./monokaikai.toml"
]

[colors.primary]
background = "#000000"
foreground = "#eaeaea"

[font]
size = 12
offset = { x = 0, y = -2 }

[font.normal]
family = "Iosevka NF"
style = "Regular"

# [font.bold]
# family = "Iosevka NF"
# style = "Bold"
#
# [font.bold_italic]
# family = "Iosevka NF"
# style = "Bold Italic"
#
# [font.italic]
# family = "Iosevka NF"
# style = "Italic"

# [window]
# decorations = "None"
# opacity = 0.7

[scrolling]
history = 3023

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[keyboard]
bindings = [
  { key = "C",       mods = "Control|Shift", action = "Copy"  },
  { key = "V",       mods = "Control|Shift", action = "Paste" },
  { key = "N",       mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Equals",  mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control",       action = "ResetFontSize"    },
  { key = "Enter",   mods = "Shift",         chars = "\n" },
]
